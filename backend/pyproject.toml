[project]
name = "cogniqs-backend"
version = "0.0.4"
description = "Cogniqs — GenAI low-code workflow automation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "httpx>=0.28.1",
    "pypdf>=4.0.0",
    "pyyaml>=6.0.0",
    "chromadb>=0.5.0",
    "tenacity>=9.0.0",
    "croniter>=1.4.0",
    "email-validator>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
# Heavy ML stack — installed on demand (auto-install) or explicitly via `.[ml]`
ml = [
    "autogluon.tabular[all]>=1.0.0",
    "autogluon.timeseries[all]>=1.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -v"
